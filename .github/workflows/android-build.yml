Name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inject Supabase Secrets to Env
        run: |
          echo "window.env = {" > env.js
          echo "  SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'," >> env.js
          echo "  SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'" >> env.js
          echo "};" >> env.js

      - name: Prepare Web Folder
        run: |
          mkdir -p www
          rsync -a ./ www/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'android' \
            --exclude 'www' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'capacitor.config.json' \
            --exclude 'server.js'
          sed -i 's/"webDir": *"\."/"webDir": "www"/' capacitor.config.json

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate App Icon
        run: |
          mkdir -p assets
          test -f king-logo.jpg
          convert king-logo.jpg \
            -resize 1024x1024 \
            -background white \
            -gravity center \
            -extent 1024x1024 \
            assets/icon.png
          npx -y @capacitor/assets generate --android --iconBackgroundColor '#ffffff'

      - name: Sync Android Platform
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeloSport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
