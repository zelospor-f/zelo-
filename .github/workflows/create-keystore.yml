name: Create Upload Keystore (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore and save it on a private-purpose branch
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          test -n "$KS_PASS" || { echo "::error::Secret KEYSTORE_PASS is missing"; exit 1; }
          test ${#KS_PASS} -ge 12 || { echo "::error::KEYSTORE_PASS must be at least 12 characters"; exit 1; }
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" signing >/dev/null 2>&1; then
            echo "::error::signing branch already exists. Not overwriting the key."; exit 1
          fi
          mkdir ks && cd ks
          git init -q
          git checkout -q --orphan signing
          keytool -genkeypair -storetype PKCS12 -keystore upload-keystore.p12 -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=ZELO Sport, O=ZELO Sport, C=TR"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add upload-keystore.p12
          git commit -q -m "upload keystore (password protected)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" signing
          echo "Keystore created on branch: signing"
