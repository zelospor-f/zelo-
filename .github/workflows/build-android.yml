              private final Map<String, int[]> stats = new HashMap<String, int[]>();
              private final Map<String, String> photos = new HashMap<String, String>();
              private final Set<String> liked = new HashSet<String>();
              private final ExecutorService pool = Executors.newFixedThreadPool(4);
              private final LruCache<String, Bitmap> cache = new LruCache<String, Bitmap>(24 * 1024 * 1024) {
                  @Override protected int sizeOf(String k, Bitmap v) { return v.getByteCount(); }
              };
              private final Set<String> reposted = new HashSet<String>();
