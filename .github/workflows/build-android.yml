name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Capacitor
        run: npm install

      - name: Inject Supabase Secrets to Env
        run: |
          echo "window.env = {" > env.js
          echo "  SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'," >> env.js
          echo "  SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'" >> env.js
          echo "};" >> env.js

      - name: Prepare Web Folder
        run: |
          mkdir -p www
          rsync -a ./ www/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'android' \
            --exclude 'native' \
            --exclude 'www' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'capacitor.config.json' \
            --exclude 'server.js'
          sed -i 's/"webDir": *"\."/"webDir": "www"/' capacitor.config.json

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Configure Android Manifest (Google Login)
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'login-callback' not in s:
              s = s.replace('</activity>', '''    <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.zelosport.app" android:host="login-callback" />
              </intent-filter>
          </activity>''', 1)
          if '<queries>' not in s:
              s = s.replace('</manifest>', '''    <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
          </manifest>''', 1)
          if 'ACCESS_NETWORK_STATE' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          assert 'ACCESS_NETWORK_STATE' in s, 'network permission was not added'
          open(p, 'w', encoding='utf-8').write(s)
          EOF

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate App Icon
        run: |
          mkdir -p assets
          test -f king-logo.jpg
          convert king-logo.jpg \
            -resize 1024x1024 \
            -background white \
            -gravity center \
            -extent 1024x1024 \
            assets/icon.png
          npx -y @capacitor/assets generate --android --iconBackgroundColor '#ffffff'

      - name: Sync Android Platform
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeloSport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
