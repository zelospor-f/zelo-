              private final Set<String> viewedMine = new HashSet<String>();
              private final Set<String> viewedSession = new HashSet<String>();
              private final Set<String> followSet = new HashSet<String>();
              private final Set<String> muteSet = new HashSet<String>();
              private final Set<String> blockSet = new HashSet<String>();
              private final Set<String> hiddenSet = new HashSet<String>();
              private final Map<String, JSONObject> preds = new HashMap<String, JSONObject>();
              private final Map<String, long[]> ropes = new HashMap<String, long[]>(); // {n0, n1, mine}
              private boolean metaLoaded = false;
              private static final Map<String, String[]> TOPICS = new HashMap<String, String[]>();
              static {
                  TOPICS.put("player", new String[] { "لاعب", "يستحق", "لا يستحق" });
                  TOPICS.put("coach", new String[] { "مدرب", "أبقوه", "أقيلوه" });
                  TOPICS.put("referee", new String[] { "حكم", "قرار صحيح", "قرار خاطئ" });
                  TOPICS.put("club", new String[] { "نادٍ", "أفخر به", "أنتقده" });
