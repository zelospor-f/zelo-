              private void showMenu(final int idx) {
                  final JSONObject o = items.get(idx);
                  final boolean mine = uid != null && uid.equals(o.optString("user_id", ""));
                  final List<String> labels = new ArrayList<String>();
                  labels.add("🔗 مشاركة الرابط");
                  if (mine) { labels.add("✏️ تعديل النص"); labels.add("🗑 حذف المنشور"); }
                  new AlertDialog.Builder(this)
                      .setItems(labels.toArray(new String[0]), new DialogInterface.OnClickListener() {
                          @Override public void onClick(DialogInterface d, int which) {
                              if (which == 0) shareLink(o);
                              else if (which == 1) editPost(idx);
                              else if (which == 2) deletePost(idx);
                          }
                      }).show();
              }

              private void shareLink(JSONObject o) {
                  String link = (linkTpl == null || linkTpl.length() == 0) ? "" : linkTpl.replace("__ID__", String.valueOf(o.optLong("id")));
                  String text = link.length() > 0 ? link : o.optString("content", "");
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_TEXT, text);
                  startActivity(Intent.createChooser(i, "مشاركة"));
              }

