                  TextView y = pill("سنوي (وفّر " + save + "٪)  ·  $" + p[3] + " / سنة", NAVY, GOLD, 0);
                  y.setOnClickListener(new View.OnClickListener() { @Override public void onClick(View v) { d.dismiss(); parent.dismiss(); goWeb("pay:" + p[5] + ":" + up); } });
