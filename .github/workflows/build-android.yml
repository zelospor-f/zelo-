name: Build Android APK and AAB

# تطبيق أندرويد أصلي خالص (Java) بلا Capacitor وبلا ويب.
# المصدر: مجلد native/*.java ؛ وهذا الملف يولّد مشروع Gradle كاملاً ثم يبنيه.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASS }}
      APP_DIR: app-project
      RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Check required files
        run: |
          test -d native || { echo "::error::native folder is missing"; exit 1; }
          test -f native/Home.java || { echo "::error::native/Home.java is missing"; exit 1; }
          test -f king-logo.jpg || { echo "::error::king-logo.jpg is missing (app icon)"; exit 1; }
          if [ -f google-services.json ]; then echo "Firebase config found"; else echo "::warning::google-services.json not found: push notifications and crash reports are OFF in this build"; fi

      - name: Create Gradle project
        run: |
          mkdir -p $APP_DIR/app/src/main/java/com/zelosport/app $APP_DIR/app/src/main/res/values $APP_DIR/app/src/main/res/xml

          cat > $APP_DIR/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ZeloSport'
          include ':app'
          EOF

          cat > $APP_DIR/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
              id 'com.google.firebase.crashlytics' version '3.0.2' apply false
          }
          EOF

          cat > $APP_DIR/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > $APP_DIR/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          def hasFirebase = file('google-services.json').exists()
          if (hasFirebase) {
              apply plugin: 'com.google.gms.google-services'
              apply plugin: 'com.google.firebase.crashlytics'
          }

          def ksFile = System.getenv('KS_FILE')

          android {
              namespace 'com.zelosport.app'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.zelosport.app'
                  minSdk 24
                  targetSdk 36
                  versionCode Integer.parseInt(System.getenv('RUN_NUMBER') ?: '1')
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      if (ksFile) {
                          storeFile file(ksFile)
                          storePassword System.getenv('KS_PASS')
                          keyAlias 'upload'
                          keyPassword System.getenv('KS_PASS')
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      if (ksFile) { signingConfig signingConfigs.release }
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
              implementation 'com.google.android.gms:play-services-ads:23.6.0'
              implementation 'com.android.billingclient:billing:8.0.0'
              implementation 'com.android.installreferrer:installreferrer:2.2'
              if (hasFirebase) {
                  implementation platform('com.google.firebase:firebase-bom:33.5.1')
                  implementation 'com.google.firebase:firebase-messaging'
                  implementation 'com.google.firebase:firebase-crashlytics'
              }
          }
          EOF

          cat > $APP_DIR/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ZELO Sport</string>
          </resources>
          EOF

          cat > $APP_DIR/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0A1033</color>
          </resources>
          EOF

          cat > $APP_DIR/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          EOF

          cat > $APP_DIR/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                      <data android:scheme="mailto" />
                  </intent>
              </queries>

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-1758612048958433~9861788893" />

                  <activity
                      android:name=".Home"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|uiMode|density|fontScale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.zelosport.app" android:host="login-callback" />
                      </intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="zelosport.net" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF
          find $APP_DIR -type f | sort

      - name: Add Firebase config
        run: |
          if [ -f google-services.json ]; then cp google-services.json $APP_DIR/app/google-services.json; fi

      - name: Copy Java sources (native/*.java)
        run: |
          dir=$APP_DIR/app/src/main/java/com/zelosport/app
          for f in native/*.java; do
            n=$(basename "$f")
            # كان خاصاً بـ Capacitor ولم يعد مستخدماً
            [ "$n" = "NativeFeedPlugin.java" ] && continue
            cp "$f" "$dir/$n"
            sed -i "1s/.*/package com.zelosport.app;/" "$dir/$n"
          done
          ls "$dir"
          head -3 "$dir/Home.java"

      - name: Copy language files into the app (assets/locales)
        run: |
          mkdir -p $APP_DIR/app/src/main/assets/locales
          if [ -d locales ]; then cp locales/*.json $APP_DIR/app/src/main/assets/locales/; fi
          ls $APP_DIR/app/src/main/assets/locales

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate App Icon
        run: |
          res=$APP_DIR/app/src/main/res
          gen() { # dir legacySize foregroundSize
            mkdir -p $res/mipmap-$1
            convert king-logo.jpg -resize ${2}x${2}! $res/mipmap-$1/ic_launcher.png
            cp $res/mipmap-$1/ic_launcher.png $res/mipmap-$1/ic_launcher_round.png
            inner=$(( $3 * 62 / 100 ))
            convert king-logo.jpg -resize ${inner}x${inner}! -background none -gravity center -extent ${3}x${3} $res/mipmap-$1/ic_launcher_foreground.png
          }
          gen mdpi 48 108
          gen hdpi 72 162
          gen xhdpi 96 216
          gen xxhdpi 144 324
          gen xxxhdpi 192 432
          mkdir -p $res/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
            cat > $res/mipmap-anydpi-v26/$n.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          done
          ls -R $res | head -40

      - name: Build Debug APK
        run: |
          cd $APP_DIR
          gradle assembleDebug --no-daemon --console=plain

      - name: Inspect APK (diagnostics)
        run: |
          APK=$(find $APP_DIR -name "app-debug.apk" | head -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "== APK: $APK"; ls -l "$APK"
          echo "== badging"; $BT/aapt2 dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:|testOnly|debuggable" || true
          echo "== signature"; $BT/apksigner verify --print-certs "$APK" 2>&1 | head -5 || true
          echo "== permissions"; $BT/aapt2 dump permissions "$APK" | head -30 || true

      - name: Fetch upload key (signing branch)
        if: github.event_name == 'workflow_dispatch' && env.KS_PASS != ''
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: signing
          path: signing

      - name: Build signed AAB for Google Play
        if: github.event_name == 'workflow_dispatch' && env.KS_PASS != ''
        run: |
          test -f signing/upload-keystore.p12 || { echo "::error::upload keystore not found. Run 'Create Upload Keystore' once first."; exit 1; }
          export KS_FILE="$GITHUB_WORKSPACE/signing/upload-keystore.p12"
          cd $APP_DIR
          gradle bundleRelease --no-daemon --console=plain
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Upload AAB Artifact
        if: github.event_name == 'workflow_dispatch' && env.KS_PASS != ''
        uses: actions/upload-artifact@v4
        with:
          name: ZeloSport-AAB
          path: ${{ env.APP_DIR }}/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeloSport-APK
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/app-debug.apk
