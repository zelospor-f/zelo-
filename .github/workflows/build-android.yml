name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Capacitor
        run: npm install

      - name: Inject Supabase Secrets to Env
        run: |
          echo "window.env = {" > env.js
          echo "  SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'," >> env.js
          echo "  SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'" >> env.js
          echo "};" >> env.js

      - name: Prepare Web Folder
        run: |
          mkdir -p www
          rsync -a ./ www/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'android' \
            --exclude 'native' \
            --exclude 'www' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'capacitor.config.json' \
            --exclude 'server.js' \
            --exclude 'google-services.json'
          sed -i 's/"webDir": *"\."/"webDir": "www"/' capacitor.config.json

      - name: Load app files from zelosport.net (web updates without new AAB)
        run: |
          python3 - <<'EOF'
          import json
          p = 'capacitor.config.json'
          c = json.load(open(p, encoding='utf-8'))
          srv = c.get('server', {})
          srv['url'] = 'https://zelospor-f.github.io/zelo-/'
          srv['androidScheme'] = 'https'
          srv['cleartext'] = False
          allow = set(srv.get('allowNavigation', []))
          allow.update(['zelospor-f.github.io', 'zelosport.net', '*.supabase.co', 'accounts.google.com'])
          srv['allowNavigation'] = sorted(allow)
          c['server'] = srv
          json.dump(c, open(p, 'w', encoding='utf-8'), indent=2)
          print(json.dumps(c, indent=2))
          EOF

      - name: Add Android Platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Add Firebase config (push notifications)
        run: |
          test -f google-services.json || { echo "::error::google-services.json missing from repo root"; exit 1; }
          cp google-services.json android/app/google-services.json
          grep -q "google-services" android/build.gradle android/app/build.gradle || { echo "::error::google-services plugin not found in Gradle files"; exit 1; }

      - name: Configure Android Manifest (Google Login)
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'login-callback' not in s:
              s = s.replace('</activity>', '''    <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.zelosport.app" android:host="login-callback" />
              </intent-filter>
          </activity>''', 1)
          if 'autoVerify' not in s:
              s = s.replace('</activity>', '''    <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="https" android:host="zelosport.net" />
              </intent-filter>
          </activity>''', 1)
          assert 'autoVerify' in s, 'app links were not added'
          if '<queries>' not in s:
              s = s.replace('</manifest>', '''    <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
          </manifest>''', 1)
          if 'POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application', 1)
          if 'ACCESS_NETWORK_STATE' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application', 1)
          assert 'ACCESS_NETWORK_STATE' in s, 'network permission was not added'
          # معرّف تطبيق AdMob (ليس سريًا). بدونه ينهار SDK الإعلانات عند التشغيل.
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace('</application>', '''    <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="ca-app-pub-1758612048958433~9861788893"/>
          </application>''', 1)
          assert 'com.google.android.gms.ads.APPLICATION_ID' in s, 'AdMob app id was not added'
          # إذن الميكروفون للرسائل الصوتية داخل الغرف
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application', 1)
          assert 'android.permission.RECORD_AUDIO' in s, 'mic permission was not added'
          open(p, 'w', encoding='utf-8').write(s)
          EOF

      - name: Allow microphone inside WebView (voice messages)
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          test -n "$f" || { echo "::error::MainActivity.java not found"; exit 1; }
          pkg=$(grep -m1 '^package ' "$f" | sed 's/package \(.*\);/\1/')
          cat > "$f" <<JAVA
          package $pkg;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(InstallReferrerPlugin.class);
                  registerPlugin(VideoTrimPlugin.class);
                  registerPlugin(NativeFeedPlugin.class);
                  super.onCreate(savedInstanceState);
              }

              @Override
              public void onStart() {
                  super.onStart();
                  getBridge().getWebView().setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (ContextCompat.checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(request.getResources());
                              } else {
                                  ActivityCompat.requestPermissions(MainActivity.this, new String[]{Manifest.permission.RECORD_AUDIO}, 7001);
                                  request.deny();
                              }
                          });
                      }
                  });
              }
          }
          JAVA
          sed -i 's/^          //' "$f"
          cat "$f" | head -12

      - name: Add Install Referrer plugin (keeps invite code through Play install)
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          dir=$(dirname "$f")
          pkg=$(grep -m1 '^package ' "$f" | sed 's/package \(.*\);/\1/')
          cat > "$dir/InstallReferrerPlugin.java" <<JAVA
          package $pkg;

          import com.android.installreferrer.api.InstallReferrerClient;
          import com.android.installreferrer.api.InstallReferrerStateListener;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "InstallReferrer")
          public class InstallReferrerPlugin extends Plugin {
              @PluginMethod
              public void getReferrer(final PluginCall call) {
                  final InstallReferrerClient client = InstallReferrerClient.newBuilder(getContext()).build();
                  client.startConnection(new InstallReferrerStateListener() {
                      @Override
                      public void onInstallReferrerSetupFinished(int code) {
                          try {
                              if (code == InstallReferrerClient.InstallReferrerResponse.OK) {
                                  JSObject o = new JSObject();
                                  o.put("referrer", client.getInstallReferrer().getInstallReferrer());
                                  call.resolve(o);
                              } else {
                                  call.reject("referrer_unavailable_" + code);
                              }
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          } finally {
                              try { client.endConnection(); } catch (Exception ignore) {}
                          }
                      }
                      @Override
                      public void onInstallReferrerServiceDisconnected() {}
                  });
              }
          }
          JAVA
          sed -i 's/^          //' "$dir/InstallReferrerPlugin.java"
          head -5 "$dir/InstallReferrerPlugin.java"
          python3 - <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          if 'installreferrer' not in s:
              s = s.replace('dependencies {', "dependencies {\n    implementation 'com.android.installreferrer:installreferrer:2.2'", 1)
          assert 'installreferrer' in s, 'installreferrer dependency not added'
          open(p, 'w', encoding='utf-8').write(s)
          EOF

      - name: Add Video Trim plugin (trim + compress videos before upload)
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          dir=$(dirname "$f")
          pkg=$(grep -m1 '^package ' "$f" | sed 's/package \(.*\);/\1/')
          cat > "$dir/VideoTrimPlugin.java" <<'JAVA'
          package $pkg;

          import android.os.Handler;
          import android.os.Looper;
          import android.util.Base64;
          import androidx.media3.common.Effect;
          import androidx.media3.common.MediaItem;
          import androidx.media3.common.MimeTypes;
          import androidx.media3.common.util.UnstableApi;
          import androidx.media3.effect.Presentation;
          import androidx.media3.transformer.Composition;
          import androidx.media3.transformer.DefaultEncoderFactory;
          import androidx.media3.transformer.EditedMediaItem;
          import androidx.media3.transformer.Effects;
          import androidx.media3.transformer.ExportException;
          import androidx.media3.transformer.ExportResult;
          import androidx.media3.transformer.ProgressHolder;
          import androidx.media3.transformer.Transformer;
          import androidx.media3.transformer.VideoEncoderSettings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.RandomAccessFile;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;

          @androidx.annotation.OptIn(markerClass = UnstableApi.class)
          @CapacitorPlugin(name = "VideoTrim")
          public class VideoTrimPlugin extends Plugin {

              private File dir() {
                  File d = new File(getContext().getCacheDir(), "ztrim");
                  d.mkdirs();
                  return d;
              }

              private String safe(String n) {
                  if (n == null) return null;
                  String s = new File(n).getName();
                  return s.isEmpty() ? null : s;
              }

              @PluginMethod
              public void writeChunk(PluginCall call) {
                  try {
                      String name = safe(call.getString("name"));
                      String data = call.getString("data");
                      boolean append = Boolean.TRUE.equals(call.getBoolean("append"));
                      if (name == null || data == null) { call.reject("bad_args"); return; }
                      FileOutputStream o = new FileOutputStream(new File(dir(), name), append);
                      try { o.write(Base64.decode(data, Base64.DEFAULT)); } finally { o.close(); }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void readChunk(PluginCall call) {
                  try {
                      String name = safe(call.getString("name"));
                      Integer off = call.getInt("offset", 0);
                      Integer len = call.getInt("length", 1048576);
                      if (name == null) { call.reject("bad_args"); return; }
                      RandomAccessFile f = new RandomAccessFile(new File(dir(), name), "r");
                      try {
                          long total = f.length();
                          int n = (int) Math.max(0, Math.min((long) len, total - off));
                          byte[] buf = new byte[n];
                          f.seek(off);
                          f.readFully(buf);
                          JSObject r = new JSObject();
                          r.put("data", Base64.encodeToString(buf, Base64.NO_WRAP));
                          r.put("size", total);
                          call.resolve(r);
                      } finally {
                          f.close();
                      }
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void clean(PluginCall call) {
                  try {
                      File[] fs = dir().listFiles();
                      if (fs != null) for (File f : fs) f.delete();
                  } catch (Exception ignore) {}
                  call.resolve();
              }

              @PluginMethod
              public void trim(final PluginCall call) {
                  final String name = safe(call.getString("name"));
                  final long startMs = call.getLong("startMs", 0L);
                  final long endMs = call.getLong("endMs", 0L);
                  final int targetHeight = call.getInt("targetHeight", 0);
                  final int bitrate = call.getInt("bitrate", 2500000);
                  if (name == null || endMs <= startMs || endMs - startMs > 61000L) { call.reject("bad_args"); return; }
                  final File in = new File(dir(), name);
                  if (!in.exists()) { call.reject("no_input"); return; }
                  final File out = new File(dir(), "out_" + System.currentTimeMillis() + ".mp4");

                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              MediaItem item = new MediaItem.Builder()
                                  .setUri(android.net.Uri.fromFile(in))
                                  .setClippingConfiguration(new MediaItem.ClippingConfiguration.Builder()
                                      .setStartPositionMs(startMs)
                                      .setEndPositionMs(endMs)
                                      .build())
                                  .build();
                              List<Effect> vfx = new ArrayList<Effect>();
                              if (targetHeight > 0) vfx.add(Presentation.createForHeight(targetHeight));
                              EditedMediaItem edited = new EditedMediaItem.Builder(item)
                                  .setEffects(new Effects(Collections.emptyList(), vfx))
                                  .build();

                              final Handler h = new Handler(Looper.getMainLooper());
                              final boolean[] done = new boolean[] { false };
                              final Transformer[] holder = new Transformer[1];
                              final ProgressHolder ph = new ProgressHolder();

                              Transformer t = new Transformer.Builder(getContext())
                                  .setVideoMimeType(MimeTypes.VIDEO_H264)
                                  .setEncoderFactory(new DefaultEncoderFactory.Builder(getContext())
                                      .setRequestedVideoEncoderSettings(new VideoEncoderSettings.Builder().setBitrate(bitrate).build())
                                      .build())
                                  .addListener(new Transformer.Listener() {
                                      @Override
                                      public void onCompleted(Composition composition, ExportResult result) {
                                          done[0] = true;
                                          JSObject r = new JSObject();
                                          r.put("name", out.getName());
                                          r.put("size", out.length());
                                          call.resolve(r);
                                      }

                                      @Override
                                      public void onError(Composition composition, ExportResult result, ExportException e) {
                                          done[0] = true;
                                          call.reject("trim_failed: " + e.getMessage());
                                      }
                                  })
                                  .build();
                              holder[0] = t;
                              t.start(edited, out.getAbsolutePath());

                              h.postDelayed(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (done[0]) return;
                                      if (holder[0].getProgress(ph) == Transformer.PROGRESS_STATE_AVAILABLE) {
                                          JSObject p = new JSObject();
                                          p.put("percent", ph.progress);
                                          notifyListeners("progress", p);
                                      }
                                      h.postDelayed(this, 500);
                                  }
                              }, 500);
                          } catch (Exception e) {
                              call.reject("trim_failed: " + e.getMessage());
                          }
                      }
                  });
              }
          }
          JAVA
          sed -i "s/^          //" "$dir/VideoTrimPlugin.java"
          sed -i "1s/.*/package $pkg;/" "$dir/VideoTrimPlugin.java"
          head -5 "$dir/VideoTrimPlugin.java"
          python3 - <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          if 'media3-transformer' not in s:
              s = s.replace('dependencies {', "dependencies {\n    implementation 'androidx.media3:media3-transformer:1.3.1'\n    implementation 'androidx.media3:media3-effect:1.3.1'\n    implementation 'androidx.media3:media3-common:1.3.1'", 1)
          assert 'media3-transformer' in s, 'media3 dependency not added'
          open(p, 'w', encoding='utf-8').write(s)
          EOF

      - name: Add Native Feed experiment (native Android screen, test only)
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -1)
          dir=$(dirname "$f")
          pkg=$(grep -m1 '^package ' "$f" | sed 's/package \(.*\);/\1/')
          cat > "$dir/NativeFeedActivity.java" <<'JAVA'
          package PKG;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowInsets;
          import android.widget.BaseAdapter;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.TextView;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.List;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class NativeFeedActivity extends Activity {
              private final List<JSONObject> items = new ArrayList<JSONObject>();
              private BaseAdapter adapter;
              private TextView status;

              private int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  final String url = getIntent().getStringExtra("url");
                  final String key = getIntent().getStringExtra("key");
                  final String token = getIntent().getStringExtra("token");

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF0A1033);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  root.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                      @Override
                      public WindowInsets onApplyWindowInsets(View v, WindowInsets ins) {
                          v.setPadding(0, ins.getSystemWindowInsetTop(), 0, ins.getSystemWindowInsetBottom());
                          return ins;
                      }
                  });

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(dp(16), dp(12), dp(16), dp(12));
                  TextView title = new TextView(this);
                  title.setText("تجربة الرئيسية الأصلية");
                  title.setTextColor(0xFFF5C35A);
                  title.setTextSize(18);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  bar.addView(title, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  TextView close = new TextView(this);
                  close.setText("✕");
                  close.setTextColor(Color.WHITE);
                  close.setTextSize(22);
                  close.setPadding(dp(12), 0, dp(4), 0);
                  close.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { finish(); }
                  });
                  bar.addView(close);
                  root.addView(bar);

                  status = new TextView(this);
                  status.setTextColor(0xFF9AA6D8);
                  status.setTextSize(13);
                  status.setPadding(dp(16), 0, dp(16), dp(8));
                  status.setText("جارٍ التحميل...");
                  root.addView(status);

                  ListView lv = new ListView(this);
                  lv.setDivider(null);
                  lv.setSelector(new android.graphics.drawable.ColorDrawable(Color.TRANSPARENT));
                  lv.setClipToPadding(false);
                  adapter = new BaseAdapter() {
                      @Override public int getCount() { return items.size(); }
                      @Override public Object getItem(int i) { return items.get(i); }
                      @Override public long getItemId(int i) { return i; }
                      @Override public View getView(int i, View cv, ViewGroup parent) {
                          LinearLayout row;
                          TextView name, body, meta;
                          if (cv == null) {
                              row = new LinearLayout(NativeFeedActivity.this);
                              row.setOrientation(LinearLayout.VERTICAL);
                              row.setPadding(dp(16), dp(14), dp(16), dp(14));
                              GradientDrawable g = new GradientDrawable();
                              g.setColor(0xFF111A4A);
                              g.setCornerRadius(dp(18));
                              g.setStroke(dp(1), 0x33F5C35A);
                              row.setBackground(g);
                              name = new TextView(NativeFeedActivity.this);
                              name.setTextColor(Color.WHITE);
                              name.setTextSize(16);
                              name.setTypeface(Typeface.DEFAULT_BOLD);
                              body = new TextView(NativeFeedActivity.this);
                              body.setTextColor(0xFFE6E9FF);
                              body.setTextSize(15);
                              body.setPadding(0, dp(8), 0, dp(8));
                              meta = new TextView(NativeFeedActivity.this);
                              meta.setTextColor(0xFF9AA6D8);
                              meta.setTextSize(12);
                              row.addView(name);
                              row.addView(body);
                              row.addView(meta);
                              row.setTag(new TextView[] { name, body, meta });
                              FrameWrap w = new FrameWrap(NativeFeedActivity.this, row, dp(16), dp(6));
                              cv = w;
                          }
                          FrameWrap fw = (FrameWrap) cv;
                          TextView[] t = (TextView[]) fw.inner.getTag();
                          JSONObject o = items.get(i);
                          t[0].setText(o.optString("author_name", ""));
                          String c = o.optString("content", "");
                          boolean vid = o.optString("video_url", "").length() > 4 && !"null".equals(o.optString("video_url", ""));
                          t[1].setText(vid ? (c.length() > 0 ? c + "\n🎬 فيديو" : "🎬 فيديو") : c);
                          t[2].setText(o.optString("created_at", "").replace("T", " ").replaceAll("\\..*$", ""));
                          return cv;
                      }
                  };
                  lv.setAdapter(adapter);
                  root.addView(lv, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(root);

                  final long t0 = System.currentTimeMillis();
                  new Thread(new Runnable() {
                      @Override public void run() {
                          String err = null;
                          final List<JSONObject> got = new ArrayList<JSONObject>();
                          try {
                              URL u = new URL(url + "/rest/v1/posts?select=id,author_name,content,created_at,video_url&order=created_at.desc&limit=40");
                              HttpURLConnection c = (HttpURLConnection) u.openConnection();
                              c.setRequestProperty("apikey", key);
                              c.setRequestProperty("Authorization", "Bearer " + token);
                              c.setConnectTimeout(15000);
                              c.setReadTimeout(20000);
                              int code = c.getResponseCode();
                              BufferedReader r = new BufferedReader(new InputStreamReader(code >= 400 ? c.getErrorStream() : c.getInputStream(), "UTF-8"));
                              StringBuilder sb = new StringBuilder();
                              String ln;
                              while ((ln = r.readLine()) != null) sb.append(ln);
                              r.close();
                              if (code >= 400) throw new Exception("HTTP " + code + " " + sb);
                              JSONArray a = new JSONArray(sb.toString());
                              for (int k = 0; k < a.length(); k++) got.add(a.getJSONObject(k));
                          } catch (Exception e) {
                              err = String.valueOf(e.getMessage());
                          }
                          final String fe = err;
                          final long ms = System.currentTimeMillis() - t0;
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  if (fe != null) { status.setText("خطأ: " + fe); return; }
                                  items.clear();
                                  items.addAll(got);
                                  adapter.notifyDataSetChanged();
                                  status.setText("تم جلب " + got.size() + " منشور خلال " + ms + " ms");
                              }
                          });
                      }
                  }).start();
              }

              // غلاف يضيف هوامش حول بطاقة المنشور
              static class FrameWrap extends android.widget.FrameLayout {
                  final LinearLayout inner;
                  FrameWrap(android.content.Context c, LinearLayout in, int h, int v) {
                      super(c);
                      inner = in;
                      setPadding(h, v, h, v);
                      addView(in, new android.widget.FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  }
              }
          }
          JAVA
          cat > "$dir/NativeFeedPlugin.java" <<'JAVA'
          package PKG;

          import android.content.Intent;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NativeFeed")
          public class NativeFeedPlugin extends Plugin {
              @PluginMethod
              public void open(PluginCall call) {
                  try {
                      Intent i = new Intent(getContext(), NativeFeedActivity.class);
                      i.putExtra("url", call.getString("url"));
                      i.putExtra("key", call.getString("key"));
                      i.putExtra("token", call.getString("token"));
                      getActivity().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }
          }
          JAVA
          sed -i "1s/.*/package $pkg;/" "$dir/NativeFeedActivity.java"
          sed -i "1s/.*/package $pkg;/" "$dir/NativeFeedPlugin.java"
          head -3 "$dir/NativeFeedActivity.java"
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'NativeFeedActivity' not in s:
              s = s.replace('</application>', '    <activity android:name=".NativeFeedActivity" android:exported="false" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" />\n    </application>', 1)
          assert 'NativeFeedActivity' in s, 'native feed activity not added'
          open(p, 'w', encoding='utf-8').write(s)
          EOF

      - name: Add Crashlytics (crash reports)
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/build.gradle'
          s = open(p, encoding='utf-8').read()
          if 'firebase-crashlytics-gradle' not in s:
              m = re.search(r"classpath\s+['\"]com\.google\.gms:google-services:[^'\"]+['\"]", s)
              assert m, 'google-services classpath not found'
              s = s[:m.end()] + "\n        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'" + s[m.end():]
              open(p, 'w', encoding='utf-8').write(s)
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          if 'com.google.firebase.crashlytics' not in s:
              s = s.replace("apply plugin: 'com.android.application'", "apply plugin: 'com.android.application'\napply plugin: 'com.google.firebase.crashlytics'", 1)
              assert 'com.google.firebase.crashlytics' in s, 'crashlytics plugin not applied'
          if 'firebase-crashlytics' not in s.replace('firebase-crashlytics-gradle',''):
              s = s.replace('dependencies {', "dependencies {\n    implementation platform('com.google.firebase:firebase-bom:33.5.1')\n    implementation 'com.google.firebase:firebase-crashlytics'", 1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          grep -n "crashlytics\|installreferrer" android/build.gradle android/app/build.gradle

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate App Icon
        run: |
          mkdir -p assets
          test -f king-logo.jpg
          convert king-logo.jpg \
            -resize 1024x1024 \
            -background white \
            -gravity center \
            -extent 1024x1024 \
            assets/icon.png
          npx -y @capacitor/assets generate --android --iconBackgroundColor '#ffffff'

      - name: Sync Android Platform
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show target SDK (Play requires a recent one)
        run: |
          grep -n "targetSdkVersion\|compileSdkVersion\|minSdkVersion" android/variables.gradle || true

      - name: Fetch upload key (signing branch)
        if: github.event_name == 'workflow_dispatch' && env.KS_PASS != ''
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: signing
          path: signing

      - name: Build signed AAB for Google Play
        if: github.event_name == 'workflow_dispatch' && env.KS_PASS != ''
        run: |
          test -f signing/upload-keystore.p12 || { echo "::error::upload keystore not found. Run 'Create Upload Keystore' once first."; exit 1; }
          export KS_FILE="$GITHUB_WORKSPACE/signing/upload-keystore.p12"
          python3 - <<'EOF'
          import re, os
          p = 'android/app/build.gradle'
          s = open(p, encoding='utf-8').read()
          if 'signingConfigs' not in s:
              block = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv('KS_FILE'))
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'upload'
                      keyPassword System.getenv('KS_PASS')
                  }
              }
              buildTypes {'''
              s = s.replace('    buildTypes {', block, 1)
              s = s.replace('release {\n            minifyEnabled', 'release {\n            signingConfig signingConfigs.release\n            minifyEnabled', 1)
          assert 'signingConfig signingConfigs.release' in s, 'could not attach signing config'
          s = re.sub(r'versionCode \d+', 'versionCode ' + os.environ['RUN_NUMBER'], s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          EOF
          cd android
          ./gradlew bundleRelease
        env:
          RUN_NUMBER: ${{ github.run_number }}

      - name: Upload AAB Artifact
        if: github.event_name == 'workflow_dispatch' && env.KS_PASS != ''
        uses: actions/upload-artifact@v4
        with:
          name: ZeloSport-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeloSport-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
