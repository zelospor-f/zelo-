                  final String tag = o.optString("author_name", "هذا المستخدم");
                  final String pid = String.valueOf(o.optLong("id"));
                  final List<String> labels = new ArrayList<String>();
                  final List<Runnable> acts = new ArrayList<Runnable>();
                  if (mine) {
                      labels.add("✏️ تعديل النص"); acts.add(new Runnable() { public void run() { editPost(idx); } });
                      labels.add("🚀 تعزيز المنشور"); acts.add(new Runnable() { public void run() { openBoost(pid); } });
                      labels.add("📊 التفاعلات"); acts.add(new Runnable() { public void run() { showEngagements(o); } });
                      labels.add(saved.contains(pid) ? "🔖 إزالة من المحفوظات" : "🔖 حفظ المنشور"); acts.add(new Runnable() { public void run() { toggleSave(idx); } });
                      labels.add("🔗 مشاركة الرابط"); acts.add(new Runnable() { public void run() { shareLink(o); } });
                      labels.add("🗑 حذف المنشور"); acts.add(new Runnable() { public void run() { deletePost(idx); } });
                  } else {
                      labels.add("🙈 لا أريد رؤية هذا"); acts.add(new Runnable() { public void run() { hidePost(o); } });
                      final boolean fl = followSet.contains(author);
                      labels.add(fl ? "➖ إلغاء متابعة " + tag : "➕ متابعة " + tag); acts.add(new Runnable() { public void run() { toggleFollowUser(author); } });
                      labels.add("🔇 كتم " + tag); acts.add(new Runnable() { public void run() { muteUser(author); } });
                      labels.add("⛔ حظر " + tag); acts.add(new Runnable() { public void run() { blockUser(author, tag); } });
                      labels.add("🚩 إبلاغ"); acts.add(new Runnable() { public void run() { goWeb("report:" + pid); } });
                      labels.add("📊 التفاعلات"); acts.add(new Runnable() { public void run() { showEngagements(o); } });
                      labels.add(saved.contains(pid) ? "🔖 إزالة من المحفوظات" : "🔖 حفظ المنشور"); acts.add(new Runnable() { public void run() { toggleSave(idx); } });
                      labels.add("🔗 مشاركة الرابط"); acts.add(new Runnable() { public void run() { shareLink(o); } });
                  }
                  new AlertDialog.Builder(this)
                      .setItems(labels.toArray(new String[0]), new DialogInterface.OnClickListener() {
                          @Override public void onClick(DialogInterface d, int which) { acts.get(which).run(); }
                      }).show();
              }

              private void shareLink(JSONObject o) {
                  String link = (linkTpl == null || linkTpl.length() == 0) ? "" : linkTpl.replace("__ID__", String.valueOf(o.optLong("id")));
                  String text = link.length() > 0 ? link : o.optString("content", "");
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_TEXT, text);
                  startActivity(Intent.createChooser(i, "مشاركة"));
              }

              private void editPost(final int idx) {
                  final JSONObject o = items.get(idx);
                  final EditText et = new EditText(this);
                  et.setText(o.optString("content", ""));
                  et.setMinLines(3);
                  et.setGravity(Gravity.TOP | Gravity.START);
                  new AlertDialog.Builder(this)
                      .setTitle("تعديل المنشور")
                      .setView(et)
                      .setNegativeButton("إلغاء", null)
                      .setPositiveButton("حفظ", new DialogInterface.OnClickListener() {
                          @Override public void onClick(DialogInterface d, int w) {
                              final String txt = et.getText().toString().trim();
                              final long id = o.optLong("id");
                              pool.execute(new Runnable() {
                                  @Override public void run() {
                                      String err = null;
                                      try {
                                          JSONObject b = new JSONObject();
                                          b.put("p_id", id);
                                          b.put("p_content", txt);
                                          send("POST", "rpc/update_post_content", b.toString());
                                          o.put("content", txt);
                                      } catch (Exception e) { err = String.valueOf(e.getMessage()); }
                                      final String fe = err;
                                      runOnUiThread(new Runnable() {
                                          @Override public void run() {
                                              if (fe != null) toast("تعذّر التعديل: " + fe);
                                              else adapter.notifyDataSetChanged();
                                          }
                                      });
                                  }
                              });
                          }
                      }).show();
              }

              private void deletePost(final int idx) {
                  final JSONObject o = items.get(idx);
                  new AlertDialog.Builder(this)
                      .setMessage("هل تريد حذف هذا المنشور؟")
                      .setNegativeButton("إلغاء", null)
                      .setPositiveButton("حذف", new DialogInterface.OnClickListener() {
                          @Override public void onClick(DialogInterface d, int w) {
                              final String id = String.valueOf(o.optLong("id"));
                              final String vp = o.isNull("video_path") ? "" : o.optString("video_path", "");
                              pool.execute(new Runnable() {
                                  @Override public void run() {
                                      String err = null;
                                      try {
                                          send("DELETE", "posts?id=eq." + id + "&user_id=eq." + uid, null);
                                          if (vp.length() > 3) {
