<!DOCTYPE html>
<html lang="ar" dir="rtl" id="app-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a1033">

    <!-- وسوم إجبار متصفح الـ APK على عدم تخزين أي نسخة قديمة -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>ZELO FC Mobile</title>

    <!-- أداة فحص الأخطاء للموبايل (vConsole) - احذفها قبل النشر النهائي -->
    <script src="https://cdn.jsdelivr.net/npm/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
        var vConsole = new VConsole();
    </script>

    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        (function() {
            var savedLang = localStorage.getItem('app_lang') ||
                            localStorage.getItem('lang') ||
                            localStorage.getItem('language') ||
                            'ar';

            var isAr = savedLang.startsWith('ar');
            document.documentElement.lang = isAr ? 'ar' : 'en';
            document.documentElement.dir = isAr ? 'rtl' : 'ltr';

            var localUserId = localStorage.getItem('zelo_user_id');
            if (!localUserId) {
                localUserId = Math.floor(100000000 + Math.random() * 900000000).toString();
                localStorage.setItem('zelo_user_id', localUserId);
            }

            window.userState = window.userState || {
                userId: localUserId,
                points: 0,
                lang: savedLang,
                walletConnected: false,
                walletAddress: ''
            };
        })();
    </script>

    <style>
        :root {
            --bg-dark: #0a1033;
            --bg-card: rgba(17, 26, 74, 0.6);
            --text-main: #f8fafc;
            --text-muted: #9aa6d6;
            --accent-purple: #2c4bb5;
            --accent-red: #14206b;
            --accent-gold: #f5c35a;
            --glass-border: rgba(245, 195, 90, 0.12);
        }

        button,
        input[type="button"],
        input[type="submit"] {
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
            background-color: transparent;
            border: none;
            outline: none;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { display: none; }

        .container {
            margin-top: 150px;
            margin-bottom: 100px;
            padding: 15px;
            min-height: calc(100vh - 250px);
            animation: fadeUp 0.6s ease-out forwards;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 138px;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            justify-content: space-between;
            align-items: center;
            column-gap: 10px;
            row-gap: 6px;
            direction: ltr; /* ثبات الترتيب: بطاقة سولانا يسار، الأيقونة الشخصية يمين */
            background: rgba(10, 16, 51, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 8px 15px;
            border-radius: 0 0 18px 18px;
            border: 1px solid rgba(245, 195, 90, 0.3);
            border-top: none;
            box-shadow: 0 5px 25px rgba(44, 75, 181, 0.25);
            z-index: 1000;
        }

        /* مساحة الإعلان داخل البطاقة العلوية (البانر الفعلي يظهر فوقها من ads.js) */
        .top-ad-slot {
            flex: 0 0 calc(100% + 30px);
            margin: 0 -15px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            color: #555566;
            font-size: 0.7rem;
        }

        /* بطاقة سعر سولانا داخل الشريط العلوي */
        .sol-card {
            flex: 1;
            min-width: 0;
            height: 54px;
            display: flex;
            align-items: center;
            gap: 10px;
            direction: ltr; /* شعار + (الاسم والسعر) يسار، ZELO يمين */
        }
        .sol-logo {
            width: 38px; height: 38px; border-radius: 12px;
            background: rgba(153, 69, 255, 0.18);
            border: 1px solid rgba(153, 69, 255, 0.45);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .sol-logo i {
            display: block; width: 18px; height: 4px; border-radius: 2px;
            background: linear-gradient(90deg, #9945FF, #14F195);
            margin: 2px 0;
        }
        .sol-logo-bars { display: flex; flex-direction: column; align-items: center; }
        .sol-logo-bars i:nth-child(1) { transform: skewX(-20deg); }
        .sol-logo-bars i:nth-child(2) { transform: skewX(20deg); }
        .sol-logo-bars i:nth-child(3) { transform: skewX(-20deg); }
        .sol-info { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; text-align: left; }
        .sol-name { font-size: 0.95rem; font-weight: 900; color: #fff; }
        .sol-sub { font-size: 0.7rem; color: var(--text-muted); }

        /* السعر صار تحت SOL / USD (مكان ZELO القديم) */
        .sol-price {
            font-size: 0.78rem; font-weight: 900;
            color: #14F195;
            direction: ltr; text-align: left;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            transition: color 0.3s;
        }
        .sol-price.down { color: #ff4d4d; }

        /* ZELO صار في الطرف الأيمن بالحجم الكبير (مكان السعر القديم) */
        .sol-points {
            margin-left: auto;
            display: flex; align-items: center; gap: 5px;
            font-size: 1.15rem; font-weight: 900; color: #f5c35a;
            direction: ltr;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .sol-points small { font-size: 0.72rem; font-weight: 900; }


        /* ===== المحفظة (بدل بطاقة سولانا) + زر الترتيب الدائري ===== */
        .menu-btn {
            width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
            background: rgba(44, 75, 181, 0.22); border: 1px solid rgba(245, 195, 90, 0.35);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform 0.2s;
        }
        .menu-btn:active { transform: scale(0.92); }
        .menu-btn svg { width: 22px; height: 22px; stroke: #f5c35a; stroke-width: 2.2; fill: none; stroke-linecap: round; }
        .wallet-card {
            flex: 1; min-width: 0; height: 54px; display: flex; align-items: center; gap: 10px;
            direction: ltr;
        }
        .wallet-bal {
            flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
            font-weight: 900; color: #f5c35a; direction: ltr; white-space: nowrap;
            font-variant-numeric: tabular-nums; font-size: 1.7rem;
        }
        .wallet-bal small { font-size: 0.9rem; font-weight: 900; }
        .rank-btn {
            position: relative; width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0;
            border: 2px solid #f5c35a; padding: 0; cursor: pointer; overflow: hidden;
            background: radial-gradient(circle at 30% 25%, #2c4bb5, #0a1033);
            box-shadow: 0 0 14px rgba(245, 195, 90, 0.45); color: #fff;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .rank-btn:active { transform: scale(0.92); }
        .rank-btn img { position: absolute; inset: 7px; width: calc(100% - 14px); height: calc(100% - 14px); object-fit: contain; opacity: 0.35; }
        .rank-btn .rank-num { position: relative; font-size: 1.35rem; font-weight: 900; text-shadow: 0 2px 6px #000, 0 0 10px rgba(0,0,0,.8); font-variant-numeric: tabular-nums; }
        .rank-btn .rank-num.small { font-size: 1.1rem; }

        .profile-header-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c4bb5, #f5c35a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(44, 75, 181, 0.4);
            transition: transform 0.2s;
            overflow: hidden;
            flex-shrink: 0;
        }
        .profile-header-btn:active {
            transform: scale(0.92);
        }

        /* ===== الشريط السفلي (أسلوب X) ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: calc(56px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-sizing: border-box;
            background: #0a1033;
            border-top: 1px solid rgba(245, 195, 90, 0.18);
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            z-index: 1000;
        }

        .nav-item {
            position: relative;
            flex: 1;
            height: 56px;
            background: none; border: none; outline: none; padding: 0; cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #9aa6d6;
            transition: color 0.15s ease;
        }
        .nav-item:active .icon-wrapper { transform: scale(0.88); }

        .icon-wrapper {
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s ease;
        }
        .icon-wrapper svg {
            width: 26px; height: 26px;
            fill: none; stroke: currentColor; stroke-width: 1.9;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* النص مخفي بصريًا (يبقى في الكود للترجمة) */
        .nav-text { display: none; }

        /* العدّاد الأزرق */
        .nav-badge {
            position: absolute; top: 6px; inset-inline-start: calc(50% + 4px);
            min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box;
            border-radius: 9px; background: #2c4bb5; color: #fff;
            border: 2px solid #0a1033;
            font-size: 0.62rem; font-weight: 900; line-height: 14px; text-align: center;
        }

        /* النشط: أبيض ومملوء */
        .nav-item.active { color: #fff; }
        .nav-item.active .icon-wrapper svg { stroke-width: 2.2; }
        .nav-item.active .icon-wrapper svg .f { fill: currentColor; }
        .nav-item.active .icon-wrapper svg .d { stroke: #0a1033; }
        .nav-item.active .icon-wrapper svg .dp { fill: #0a1033; stroke: #0a1033; }

        .btn-action {
            position: relative; width: 100%;
            background: linear-gradient(270deg, var(--accent-purple), var(--accent-red), var(--accent-gold), var(--accent-red), var(--accent-purple));
            background-size: 400% 400%; animation: gradientMove 3s ease infinite, pulseShadow 2s infinite alternate;
            color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 900; font-size: 1.1rem;
            cursor: pointer; margin-top: 10px; transition: transform 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            overflow: hidden; z-index: 1;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes pulseShadow { 0% { box-shadow: 0 0 10px rgba(44, 75, 181, 0.4); } 100% { box-shadow: 0 0 25px rgba(245, 195, 90, 0.6); } }
        @keyframes floatIcon { 0% { transform: translateY(0px) scale(1.1); } 50% { transform: translateY(-5px) scale(1.15); } 100% { transform: translateY(0px) scale(1.1); } }
        @keyframes pulseGlowIcon { 0% { filter: drop-shadow(0 0 5px var(--accent-purple)); } 50% { filter: drop-shadow(0 0 15px var(--accent-red)); } 100% { filter: drop-shadow(0 0 8px var(--accent-gold)); } }
    </style>
</head>
<body>

    <!-- الهيدر العلوي: رصيد ZELO + زر القائمة + دائرة الترتيب (تفتح لوحة الصدارة) -->
    <header class="top-bar" id="top-bar" style="display: none;">
        <div class="wallet-card" id="top-wallet-card">
            <div class="menu-btn" id="menu-header-btn" role="button" aria-label="القائمة" title="القائمة" onclick="window.openSideDrawer && window.openSideDrawer()">
                <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </div>
            <div class="wallet-bal">
                <span>🪙</span>
                <span id="top-points">0</span>
                <small>ZELO</small>
            </div>
        </div>

        <button class="rank-btn" id="rank-btn" aria-label="لوحة الصدارة" title="لوحة الصدارة" onclick="window.showPage && window.showPage('leaderboard')">
            <img id="rank-club-logo" alt="" style="display:none" onerror="this.style.display='none'">
            <span class="rank-num" id="rank-num">🏆</span>
        </button>

        <!-- مساحة الإعلان داخل البطاقة -->
        <div class="top-ad-slot" id="top-ad-slot"><span>إعلان</span></div>

        <!-- عناصر مخفية يستخدمها باقي الكود (حتى لا تحدث أخطاء) -->
        <div id="club" style="display:none;"></div>
        <div id="points" style="display:none;"></div>
    </header>

    <main class="container" id="main-content">
        <!-- حاوية فارغة (بدون نص أو كرة) يحتفظ بها الكود لمعالجة الأخطاء -->
        <div id="app-loading"></div>
    </main>

    <!-- Bottom Navigation: الرئيسية | المباريات | الرادار | الإشعارات | الرسائل (الترتيب انتقل إلى القائمة الجانبية) -->
    <nav class="bottom-nav" id="bottom-nav" style="display: none;">
        <button class="nav-item active" aria-label="Home" onclick="showPage('home')">
            <span class="icon icon-wrapper"><svg viewBox="0 0 24 24"><path class="f" d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>
            <span class="nav-text" data-i18n="navHome">الرئيسية</span>
        </button>
        <button class="nav-item" aria-label="Matches" onclick="showPage('matches')">
            <span class="icon icon-wrapper"><svg viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="9"/><path class="dp" d="M12 8.2l3.2 2.3-1.2 3.7h-4l-1.2-3.7z"/><path class="d" d="M12 8.2V3.2M15.2 10.5l4.6-1.5M14 14.2l2.8 3.9M10 14.2l-2.8 3.9M8.8 10.5 4.2 9"/></svg></span>
            <span class="nav-text" data-i18n="navMatches">المباريات</span>
        </button>
        <button class="nav-item" id="nav-radar" aria-label="Fan Pulse Radar" onclick="window.openFanRadar && window.openFanRadar()">
            <span class="icon icon-wrapper"><svg viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="9"/><circle class="d" cx="12" cy="12" r="5.2" fill="none"/><circle class="dp" cx="12" cy="12" r="1.6"/><path class="d" d="M12 12l5.5-5.5"/></svg></span>
            <span class="nav-text" data-i18n="navRadar">الرادار</span>
        </button>
        <button class="nav-item" id="nav-notifications" aria-label="Alerts" onclick="showPage('notifications')">
            <span class="icon icon-wrapper"><svg viewBox="0 0 24 24"><path class="f" d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21.5a2 2 0 0 0 4 0"/></svg></span>
            <span class="nav-badge" id="notif-badge" style="display:none;">0</span>
            <span class="nav-text" data-i18n="navNotifications">الإشعارات</span>
        </button>
        <button class="nav-item" id="nav-messages" aria-label="Messages" onclick="showPage('messages')">
            <span class="icon icon-wrapper"><svg viewBox="0 0 24 24"><rect class="f" x="3" y="5" width="18" height="14" rx="2.5"/><path class="d" d="m3.8 7.2 8.2 6.3 8.2-6.3"/></svg></span>
            <span class="nav-badge" id="msg-badge" style="display:none;">0</span>
            <span class="nav-text" data-i18n="navMessages">الرسائل</span>
        </button>
    </nav>


    <script>
        window.addEventListener('error', function(e) {
            console.error("Global Error Caught Mobile:", e);
            const container = document.getElementById('main-content');
            if (container && container.querySelector('#app-loading')) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 30px; color: #ff4d4d;">
                        <h3>⚠️ حدث خطأ أثناء تحميل التطبيق</h3>
                        <p id="app-err-msg" style="font-size: 0.85rem; color: #aaa;"></p>
                        <button onclick="location.reload()" class="btn-action" style="margin-top:15px; width: auto; padding: 10px 20px;">إعادة التحميل</button>
                    </div>
                `;
                var msgEl = document.getElementById('app-err-msg');
                if (msgEl) msgEl.textContent = e.message || 'خطأ غير معروف';
            }
        });
    </script>

    <!-- تم حذف سعر سولانا؛ الدالة تبقى فارغة حتى لا تتعطل ملفات تستدعيها -->
    <script>window.updateTopSolPrice = function() {};</script>

    <!-- دائرة الترتيب: رقم مركز ناديك + شعاره، والنقر يفتح لوحة الصدارة -->
    <script>
        (function() {
            function allClubs() {
                var a = [];
                if (typeof allWorldCupCountriesClubs !== 'undefined') {
                    Object.values(allWorldCupCountriesClubs).forEach(function(c) { a.push.apply(a, c); });
                }
                return a;
            }
            async function updateRankBadge() {
                var numEl = document.getElementById('rank-num');
                var logoEl = document.getElementById('rank-club-logo');
                var c = (typeof supabaseClient !== 'undefined' && supabaseClient) ? supabaseClient : null;
                var uid = window.userState && window.userState.userId ? String(window.userState.userId) : '';
                if (!numEl || !c || !uid) return;
                try {
                    var r = await c.from('club_fans_rankings').select('user_id, club_id, total_fan_points');
                    var rows = (r && r.data) || [];
                    var pts = {}, myClub = null;
                    rows.forEach(function(f) {
                        pts[f.club_id] = (pts[f.club_id] || 0) + (f.total_fan_points || 0);
                        if (String(f.user_id) === uid) myClub = f.club_id;
                    });
                    if (!myClub) return;
                    var list = allClubs().map(function(cl) { return { cl: cl, p: pts[cl.id] || 0 }; })
                        .sort(function(a, b) { return b.p - a.p; });
                    var idx = list.findIndex(function(x) { return x.cl.id === myClub; });
                    if (idx < 0) return;
                    numEl.textContent = String(idx + 1);
                    numEl.classList.toggle('small', idx + 1 > 99);
                    if (list[idx].cl.logo) { logoEl.src = list[idx].cl.logo; logoEl.style.display = ''; }
                } catch (e) {}
            }
            window.updateRankBadge = updateRankBadge;
            setTimeout(updateRankBadge, 3500);
            setInterval(updateRankBadge, 90000);
        })();
    </script>

    <!-- تحميل رصيد ZELO من جدول المستخدمين إلى الشريط العلوي -->
    <script>
        (function() {
            function loadZeloBalance() {
                var uid = window.userState && window.userState.userId;
                if (!uid || typeof supabaseClient === 'undefined' || !supabaseClient) return;
                supabaseClient.from('users').select('points').eq('user_id', String(uid)).maybeSingle()
                    .then(function(r) {
                        if (r && r.data) window.userState.points = Number(r.data.points) || 0;
                    })
                    .catch(function() {});
            }
            window.loadZeloBalance = loadZeloBalance;
            setTimeout(loadZeloBalance, 3000);
            setInterval(loadZeloBalance, 30000);
        })();
    </script>

    <!-- نقاط اللاعب في الشريط العلوي (تتحدث تلقائيًا من userState.points) -->
    <script>
        (function() {
            function updateTopPoints() {
                var el = document.getElementById('top-points');
                if (!el) return;
                var pts = (window.userState && Number(window.userState.points)) || 0;
                el.textContent = pts.toLocaleString('en-US');
            }
            window.updateTopPoints = updateTopPoints;
            updateTopPoints();
            setInterval(updateTopPoints, 1000);
        })();
    </script>

    <!-- عدّاد الرسائل غير المقروءة على أيقونة الرسائل -->
    <script>
        (function() {
            async function updateMsgBadge() {
                var el = document.getElementById('msg-badge');
                var c = (typeof supabaseClient !== 'undefined' && supabaseClient) ? supabaseClient : null;
                var uid = window.userState && window.userState.userId ? String(window.userState.userId) : '';
                if (!el || !c || !uid) return;
                try {
                    var r = await c.from('dm_messages').select('id', { count: 'exact', head: true })
                        .eq('receiver_id', uid).is('read_at', null);
                    var n = (r && r.count) || 0;
                    el.textContent = n > 99 ? '99+' : String(n);
                    el.style.display = n > 0 ? '' : 'none';
                } catch (e) {}
            }
            window.updateMsgBadge = updateMsgBadge;
            setInterval(updateMsgBadge, 15000);
            setTimeout(updateMsgBadge, 4000);
        })();
    </script>

    <!-- تحميل جميع الملفات ديناميكياً برقم وقت فريد يمنع الـ APK من حفظ القديم -->
    <script>
        (function() {
            var timeStamp = '?v=' + new Date().getTime();
            var scriptFiles = [
                'env.js',
                'clubsData.js',
                'data.js',
                'countries.js',
                'i18n-helpers.js',
                'ranking.js',
                'auth.js',
                'referrals.js',
                'login.js',
                'weekly_match_rankings.js',
                'badges.js',
                'share-card.js',
                'matches.js',
